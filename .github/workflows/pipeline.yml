name: ML pipeline

on:
  push:
    branches: [main]

jobs:
  train-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate data
        run: python src/validate_data.py

      - name: Train baseline and candidate model
        run: python src/train.py

      - name: Quality gate
        run: python src/evaluate.py

      - name: Application tests
        run: pytest -v

      - name: Assemble model package
        run: |
          mkdir -p package
          cp models/model.joblib package/
          cp metrics/metrics_report.json package/
          cp src/predict.py package/
          cp requirements.txt package/

      - name: Upload model package
        uses: actions/upload-artifact@v4
        with:
          name: wine-model-package-run-${{ github.run_number }}-${{ github.sha }}
          path: package/
